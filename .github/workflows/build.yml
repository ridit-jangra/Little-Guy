name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r build-requirements.txt
      
      - name: Build executable
        run: |
          pyinstaller build.spec
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LittleGuy-Windows
          path: dist/LittleGuy.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxkbcommon-x11-0
      
      - name: Install dependencies
        run: |
          pip install -r build-requirements.txt
      
      - name: Build executable
        run: |
          pyinstaller build.spec
      
      - name: Rename executable
        run: mv dist/LittleGuy dist/LittleGuy-Linux
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LittleGuy-Linux
          path: dist/LittleGuy-Linux

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: LittleGuy-Windows
      
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: LittleGuy-Linux
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            LittleGuy.exe
            LittleGuy-Linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
